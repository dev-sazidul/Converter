services:
  backend:
    build: ./backend
    environment:
      ENVIRONMENT: production
      STORAGE_DIR: /data/storage
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-25}
      MAX_TOTAL_SIZE_MB: ${MAX_TOTAL_SIZE_MB:-100}
      MAX_FILES: ${MAX_FILES:-20}
      MAX_PAGES: ${MAX_PAGES:-150}
      JOB_TTL_SECONDS: ${JOB_TTL_SECONDS:-3600}
      CLEANUP_INTERVAL_SECONDS: ${CLEANUP_INTERVAL_SECONDS:-300}
    volumes:
      - pdf-storage:/data/storage
    expose:
      - "8000"
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  postgres:
    profiles: ["full"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-convarter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-convarter}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-convarter}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    profiles: ["full"]
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped

volumes:
  pdf-storage:
  pg-data:
