# Production stack. Next.js is the only published service (HTTP_PORT, 8080 by default).
# The Python converter (backend) is reachable only from inside this Docker network.
#
# Uploads and the SQLite database live in the named volumes at the bottom. Docker
# creates them owned by each image's user, so no chown is needed. They survive
# `docker compose down` and rebuilds. `docker compose down -v` deletes them.
#
# This serves plain HTTP. Put HTTPS in front (Caddy, a hosting platform, or a CDN),
# with an upload limit of about MAX_REQUEST_MB.

name: convarter

services:
  backend:
    build:
      context: ./backend
    image: convarter-backend:${IMAGE_TAG:-local}
    environment:
      ENVIRONMENT: production
      STORAGE_DIR: /data/storage
      CONVERTER_TOKEN: ${CONVERTER_TOKEN:-}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-25}
      MAX_TOTAL_SIZE_MB: ${MAX_TOTAL_SIZE_MB:-100}
      MAX_FILES: ${MAX_FILES:-20}
      MAX_PAGES: ${MAX_PAGES:-150}
      JOB_TTL_SECONDS: ${JOB_TTL_SECONDS:-3600}
      CLEANUP_INTERVAL_SECONDS: ${CLEANUP_INTERVAL_SECONDS:-300}
      MAX_IMAGE_PIXELS: ${MAX_IMAGE_PIXELS:-40000000}
      ALLOWED_DPI: ${ALLOWED_DPI:-96,150,200}
      CONVERSION_TIMEOUT_SECONDS: ${CONVERSION_TIMEOUT_SECONDS:-120}
      HTML_NAVIGATION_TIMEOUT_SECONDS: ${HTML_NAVIGATION_TIMEOUT_SECONDS:-25}
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-2}
      QUEUE_TIMEOUT_SECONDS: ${QUEUE_TIMEOUT_SECONDS:-30}
      PDFA_ICC_PATH: ${PDFA_ICC_PATH:-}
    volumes:
      - storage:/data/storage
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    restart: unless-stopped
    init: true
    # LibreOffice and Chromium use a lot of memory. A runaway job is stopped here
    # instead of pushing the whole VM into swap.
    mem_limit: ${BACKEND_MEM_LIMIT:-2g}
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: ./frontend
      args:
        SITE_URL: ${SITE_URL:-https://bestconvert.site}
        NEXT_PUBLIC_ADSENSE_CLIENT: ${NEXT_PUBLIC_ADSENSE_CLIENT:-}
        NEXT_PUBLIC_ADSENSE_SLOT_HEADER: ${NEXT_PUBLIC_ADSENSE_SLOT_HEADER:-}
        NEXT_PUBLIC_ADSENSE_SLOT_HOME: ${NEXT_PUBLIC_ADSENSE_SLOT_HOME:-}
        NEXT_PUBLIC_ADSENSE_SLOT_CONTENT: ${NEXT_PUBLIC_ADSENSE_SLOT_CONTENT:-}
        NEXT_PUBLIC_ADSENSE_SLOT_TOOL: ${NEXT_PUBLIC_ADSENSE_SLOT_TOOL:-}
        NEXT_PUBLIC_ADSENSE_SLOT_FOOTER: ${NEXT_PUBLIC_ADSENSE_SLOT_FOOTER:-}
    image: convarter-frontend:${IMAGE_TAG:-local}
    environment:
      PORT: 3000
      HOSTNAME: 0.0.0.0
      CONVERTER_URL: http://backend:8000
      CONVERTER_TOKEN: ${CONVERTER_TOKEN:-}
      # Fixed here on purpose. An older .env may still hold the reserved Postgres URL.
      DATABASE_URL: file:/data/db/app.db
      SITE_URL: ${SITE_URL:-https://bestconvert.site}
      # Largest request body Next.js forwards to the converter.
      MAX_REQUEST_MB: ${MAX_REQUEST_MB:-120}
      NODE_ENV: production
      # Optional SMTP settings for /contact notifications.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      CONTACT_FROM_EMAIL: ${CONTACT_FROM_EMAIL:-}
      CONTACT_TO_EMAIL: ${CONTACT_TO_EMAIL:-}
    volumes:
      - database:/data/db
    ports:
      - "127.0.0.1:${HTTP_PORT:-8081}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    init: true
    mem_limit: ${FRONTEND_MEM_LIMIT:-768m}
    security_opt:
      - no-new-privileges:true

  postgres:
    profiles: ["full"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-convarter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-convarter}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-convarter}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    profiles: ["full"]
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped

volumes:
  storage:
  database:
  postgres:
